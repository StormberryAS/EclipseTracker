# GitHub Pages serves eclipse.stormberry.as from this repository root.
#
# Without this file Jekyll publishes the WHOLE repository, so the tooling scripts, the
# README and the licence were all reachable from the live site. Nothing here was secret,
# these repos are public, but source and tooling have no business being served next to
# the product.
#
# Added 2026-09-05 in the estate-wide sweep that followed finding
# scheduler.stormberry.as/index.dev.html live, a second working rendering of that app.
#
# Jekyll's `exclude` REPLACES its defaults rather than adding to them, which is why
# node_modules/ and friends are listed where they apply.
#
# disclaimer.html and privacy.html are deliberately NOT excluded: they are the published
# pages the footer links to. Only the Markdown sources are withheld.
#
# The TypeScript move (EclipseTracker 2.0, staged 2026-10-16, the Website's 2026-10-14 pattern):
# the TypeScript sources (ts/), the build and data tooling with the archived NASA pages (tools/),
# the tests (tests/), the package files, tsconfig.json and the installed compiler (node_modules/,
# never committed) are excluded, and so is tsconfig.core.json (the DOM-free check of ts/core/, added
# 2026-10-16 after the code review). The page loads only the compiled app.js and core/*.js, which ARE
# published. data/eclipses.json is published on purpose: it is the same eclipse list as JSON, for
# the Android app and anyone who wants it.
#
# The Android app (EclipseTracker 2.0 stage B, staged 2026-10-16): its Gradle project lives in
# android/ beside the website, as GDPRLetterBuilder's does, and is never published; its build copies
# the published files into the APK byte for byte and checks them against this list.
#
# The Zapstore listing (EclipseTracker for Android 2.0.0, 17 October 2026): zapstore.yaml and the
# store texts, icon and screenshots in fastlane/ are for zsp, the Zapstore publisher, which reads
# them from the repository; they are not part of the website. .github/ is left out by Jekyll on its
# own (a dot folder).
#
# CHANGELOG.md (EclipseTracker for Android 2.0.1, 29 October 2026): the Android release log, a
# document for the repository like README.md, not a page of the website.
exclude:
  - CHANGELOG.md
  - DISCLAIMER.md
  - LICENSE
  - README.md
  - bump_assets.py
  - .npmrc
  - node_modules/
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.core.json
  - ts/
  - tools/
  - tests/
  - android/
  - fastlane/
  - zapstore.yaml
